version: "3.8"

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mc_music_db}
    ports:
      - "5432:5432"
    volumes:
      - ./database/init-docker.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-mc_music_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mc_music_network

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mc_music_network

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8687:8686" # Đã đổi cổng ra ngoài là 8687 để tránh xung đột
    networks:
      - mc_music_network
    depends_on:
      users-service:
        condition: service_started
      artists-service:
        condition: service_started
      admin-service:
        condition: service_started
      catalog-service:
        condition: service_started

  users-service:
    build:
      context: ./backend
      dockerfile: users-service/Dockerfile
    container_name: users-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://postgres-db:5432/${DB_NAME:-mc_music_db}?currentSchema=mc_music_users_schema
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - KAFKA_SERVERS=kafka:29092
      - CATALOG_SERVICE_URL=http://catalog-service:8081
      - ARTIST_SERVICE_URL=http://artists-service:8083
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - mc_music_network

  catalog-service:
    build:
      context: ./backend
      dockerfile: catalog-service/Dockerfile
    container_name: catalog-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://postgres-db:5432/${DB_NAME:-mc_music_db}?currentSchema=mc_music_catalog_schema
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - KAFKA_SERVERS=kafka:29092
      - ARTISTS_SERVICE_URL=http://artists-service:8083
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - mc_music_network

  artists-service:
    build:
      context: ./backend
      dockerfile: artists-service/Dockerfile
    container_name: artists-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://postgres-db:5432/${DB_NAME:-mc_music_db}?currentSchema=mc_music_artists_schema
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - KAFKA_SERVERS=kafka:29092
      - CATALOG_SERVICE_URL=http://catalog-service:8081
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - mc_music_network

  admin-service:
    build:
      context: ./backend
      dockerfile: admin-service/Dockerfile
    container_name: admin-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://postgres-db:5432/${DB_NAME:-mc_music_db}?currentSchema=mc_music_admin_schema
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - USERS_SERVICE_URL=http://users-service:8082
      - ARTISTS_SERVICE_URL=http://artists-service:8083
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - mc_music_network

networks:
  mc_music_network:
    driver: bridge

volumes:
  postgres_data:
