server {
    listen 80;
    server_name api.mypersonsite.com; # Thay bằng domain thực tế của bạn trên VPS

    # Cấu hình lưu log riêng cho API Gateway
    access_log /var/log/nginx/api-gateway.access.log;
    error_log /var/log/nginx/api-gateway.error.log;

    # Cấu hình tối đa kích thước file upload (nếu project có upload nhạc/ảnh)
    client_max_body_size 50M;

    location / {
        # Trỏ traffic từ Nginx (VPS) vào API Gateway đang chạy ở localhost:8686
        proxy_pass http://127.0.0.1:8686;
        
        # Giữ nguyên thông tin của client khi đi qua proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ cấu hình WebSocket (nếu dự án tương lai có dùng Socket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
