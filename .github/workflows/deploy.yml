name: CI/CD Pipeline to VPS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. API Gateway
      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/api-gateway/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/api-gateway:latest

      # 2. Users Service
      - name: Build and push Users Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/users-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/users-service:latest

      # 3. Artists Service
      - name: Build and push Artists Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/artists-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/artists-service:latest

      # 4. Catalog Service
      - name: Build and push Catalog Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/catalog-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/catalog-service:latest

      # 5. Admin Service
      - name: Build and push Admin Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/admin-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/admin-service:latest

  deploy-to-vps:
    name: Deploy to VPS Server
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH into VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Di chuyển vào thư mục code cấu hình trên VPS
            cd /opt/mcmusic-deploy
            
            # Đăng nhập GHCR để có quyền Pull image (Phòng trường hợp Github Repo là Private)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Lấy file .env để truyền biến DOCKER_REGISTRY (thực hiện ở thực tế)
            # Pull image mới nhất từ Registry
            docker compose -f docker-compose.production.yml pull
            
            # Deploy tự động, tạo mới các container có thay đổi image
            docker compose -f docker-compose.production.yml up -d --remove-orphans
